name: iOS imzasız IPA

# SADECE ELLE TETİKLENİR (macOS dakikaları pahalıdır; her push'ta çalışmaz).
# Çıktı: imzasız .ipa (artifact). Windows'ta Sideloadly ile ücretsiz Apple ID'yle imzalanıp yüklenir.
# Bkz. docs/build-ios.md
on:
  workflow_dispatch:

concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ios/ klasörü repoda yok (.gitignore); burada üretilir.
      - name: Native iOS projesini üret (prebuild + pod install)
        run: npx expo prebuild --platform ios --no-install && cd ios && pod install

      - name: Derle (imzasız, Release, gerçek cihaz)
        run: |
          xcodebuild \
            -workspace ios/optes.xcworkspace \
            -scheme optes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/optes.app Payload/
          zip -qr optes-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: optes-unsigned-ipa
          path: optes-unsigned.ipa
          retention-days: 7
